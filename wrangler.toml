name = "trends"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Cron trigger: every minute
[triggers]
crons = ["* * * * *"]

# D1 database binding (code expects env.DB)
[[d1_databases]]
binding = "DB"
database_name = "trends-db"
database_id = "5cb81308-7a86-4e9b-8801-b401b197f3c4"

# Workers AI binding
[ai]
binding = "AI"

# Environment variables
[vars]
SITE_HOST          = "trendingrightnow.online"         # hostname only (no https:// or trailing /)
SITE_NAME          = "Trending Now"                    # publisher / site name in JSON-LD & header
CONTACT_EMAIL      = "tushar.ikontel@gmail.com"
GEO_LIST           = "US,GB,CA,AU,IN"                  # global English markets (US prioritized)
MAX_DAILY          = "180"                             # fits safely inside Google Indexing API's 200/day free publish limit
MAX_HOURLY         = "8"                               # hourly cap to spread 180/day cleanly across all 24h UTC
PUBLISH_GAP_MINS   = "7"                               # min minutes between new live posts (~7-8/hr, zero bursts)
INDEXNOW_KEY       = "3351402e2770d203c6a06bab4ba4ff4e"
BASE_TTL_HOURS     = "336"                             # default post lifetime (14 days for new-domain crawl & index warmup)
EXTENDED_TTL_HOURS = "720"                             # extended lifetime (30 days) when search traction is proven
EXTEND_MIN_HITS    = "1"                               # search-engine human visits within 48h needed to extend
WEBHOOK_MIN_GAP_MINS = "100"                           # pace Make.com webhook (~14 viral posts/day -> fits 1,000 ops/mo safely)
# SITE_END_AT      = "2026-12-01T00:00:00Z"            # stop fetching new topics; serve live posts until expires_at, then 410
# DEV_MODE         = "true"                            # uncomment for local testing with mock RSS

# Secrets (set via CLI, not here):
#   npx wrangler secret put GEMINI_API_KEY        # Google AI Studio free tier (recommended primary)
#   npx wrangler secret put NVIDIA_API_KEY        # optional build.nvidia.com free endpoint
#   npx wrangler secret put MISTRAL_API_KEY       # optional console.mistral.ai free Experiment tier
#   npx wrangler secret put OPENROUTER_API_KEY    # optional openrouter.ai :free models
#   npx wrangler secret put CEREBRAS_API_KEY      # optional Cerebras free endpoint
#   npx wrangler secret put CUSTOM_AI_URL         # optional custom OpenAI-compatible chat URL (+ CUSTOM_AI_KEY, CUSTOM_AI_MODEL)
#   npx wrangler secret put GOOGLE_INDEXING_KEY   # Google Indexing API v3 service account JSON
#   Free Social Auto-Publish Secrets (optional, 0 budget):
#   npx wrangler secret put FB_PAGE_ID            # Facebook Page numeric ID (+ FB_PAGE_TOKEN)
#   npx wrangler secret put FB_PAGE_TOKEN         # Facebook Page Access Token (Graph API)
#   npx wrangler secret put BLUESKY_HANDLE        # (+ BLUESKY_APP_PASSWORD)
#   npx wrangler secret put TELEGRAM_BOT_TOKEN    # (+ TELEGRAM_CHANNEL_ID e.g. @yourchannel)
#   npx wrangler secret put MASTODON_INSTANCE     # e.g. https://mastodon.social (+ MASTODON_TOKEN)
#   npx wrangler secret put DISCORD_WEBHOOK_URL   # Discord channel webhook
#   npx wrangler secret put SOCIAL_WEBHOOK_URL    # Generic JSON webhook (n8n, Make, etc.)
